<section class="variables-card" id="variables">
  <header class="variables-card__head">
    <p class="t-eyebrow">Variables</p>
  </header>
  {% set vars = form or (server.variables or {}) %}
  <form class="variables-form"
        hx-post="/servers/{{ server.name }}/variables"
        hx-target="#variables"
        hx-swap="outerHTML">
    <label>
      <span class="t-eyebrow">Memory budget (GB)</span>
      <input type="number"
             name="memory_budget_gb"
             min="{{ memory_min_gb }}"
             value="{{ vars.memory_budget_gb if vars.memory_budget_gb is not none else '' }}"
             autofocus
             required>
      {% if errors.memory_budget_gb %}<small class="variables-form__error">{{ errors.memory_budget_gb }}</small>{% endif %}
    </label>

    <label>
      <span class="t-eyebrow">Port</span>
      <input type="number"
             name="port"
             min="1024"
             max="65535"
             value="{{ vars.port if vars.port is not none else '' }}"
             required>
      {% if errors.port %}<small class="variables-form__error">{{ errors.port }}</small>{% endif %}
    </label>

    <label>
      <span class="t-eyebrow">Server jar filename</span>
      <input type="text"
             name="server_jar"
             value="{{ vars.server_jar or '' }}"
             autocomplete="off"
             required>
      {% if errors.server_jar %}<small class="variables-form__error">{{ errors.server_jar }}</small>{% endif %}
    </label>

    <label>
      <span class="t-eyebrow">Java version</span>
      <select name="java_version" required>
        {% for v in java_versions %}
          <option value="{{ v }}"{% if (vars.java_version or default_java_version) == v %} selected{% endif %}>{{ v }}</option>
        {% endfor %}
      </select>
      <small class="t-muted">Minecraft 1.20.5–1.21.x need Java 21; 26.x needs Java 25; ≤1.20.4 works with 17</small>
      {% if errors.java_version %}<small class="variables-form__error">{{ errors.java_version }}</small>{% endif %}
    </label>

    <label>
      <span class="t-eyebrow">JVM extra args (optional)</span>
      <input type="text"
             name="jvm_extra_args"
             value="{{ vars.jvm_extra_args or '' }}"
             autocomplete="off">
    </label>

    <div class="variables-form__actions">
      <button type="submit" class="btn btn--primary">Save</button>
      <a class="btn btn--ghost"
         hx-get="/servers/{{ server.name }}/variables"
         hx-target="#variables"
         hx-swap="outerHTML"
         href="#">Cancel</a>
    </div>
  </form>
</section>
