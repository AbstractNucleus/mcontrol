<section class="log-pane">
  <header class="log-pane__head">
    <p class="t-eyebrow">Logs</p>
    <span class="pane-status" data-stream-status data-state="connecting">
      <span class="pane-status__dot" aria-hidden="true"></span>
      <span class="pane-status__label" data-stream-status-label>connecting…</span>
    </span>
  </header>
  <div class="log-pane__body">
    <pre id="log-stream"
         class="log-pane__stream"
         role="log"
         aria-live="polite"
         aria-atomic="false"
         aria-label="Server log output"
         hx-ext="sse"
         sse-connect="/servers/{{ server.name }}/logs"
         sse-swap="message"
         sse-close="closed"
         hx-swap="beforeend"
         data-stream-scroll></pre>
    <button type="button" class="pane-jump" data-stream-jump hidden>
      <span data-stream-jump-count>0</span> new lines ↓
    </button>
  </div>
</section>
