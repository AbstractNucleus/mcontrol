{% from "_icons.html" import icon %}
<div class="trash-modal" role="dialog" aria-modal="true" aria-labelledby="trash-delete-title" data-modal-root tabindex="-1">
  <div class="trash-modal__panel">
    <span class="page-symbol page-symbol--danger">{{ icon('trash', size=22) }}</span>
    <h3 id="trash-delete-title" class="trash-modal__title">Delete tombstone</h3>
    <p class="trash-modal__hint">
      Permanently removes <code>{{ dir_name }}</code> from disk. This is the
      purge step: files are deleted; recovery is not possible from the panel
      after this.
    </p>

    <form class="trash-modal__form"
          hx-post="/trash/{{ dir_name }}/delete"
          hx-target="#trash-modal"
          hx-swap="innerHTML">
      <label>
        <span>Type <code>{{ original_name }}</code> to confirm</span>
        <input type="text"
               name="confirm_name"
               value="{{ confirm_name or '' }}"
               autocomplete="off"
               {% if error %}aria-invalid="true"{% endif %}
               autofocus
               required>
        {% if error %}<small class="trash-modal__error">{{ error }}</small>{% endif %}
      </label>
      <div class="trash-modal__actions">
        <button type="button" class="btn btn--ghost" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn--danger-solid">{{ icon('trash') }} Delete now</button>
      </div>
    </form>
  </div>
</div>
