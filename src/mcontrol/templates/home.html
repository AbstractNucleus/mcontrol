{% extends "base.html" %}

{% block title %}mcontrol: servers{% endblock %}

{% block main %}
<section>
  <div class="home-header">
    <div class="home-header__title">
      <p class="t-eyebrow">Fleet</p>
      <h1 class="t-h1">Servers</h1>
    </div>
    <div class="home-header__actions">
      <button class="btn btn--ghost btn--sm"
              type="button"
              hx-post="/rescan"
              hx-swap="none"
              hx-disabled-elt="this"
              title="Re-walk SERVER_BASE_PATH and refresh container state from Docker">Rescan{% include "_spinner.html" %}</button>
      <a class="btn btn--primary" href="/servers/new">New server</a>
    </div>
  </div>

  <div class="filter-bar" data-fleet-filters>
    <label>Find a server<input type="search" data-fleet-search placeholder="Search by name" autocomplete="off"></label>
    <label>Status<select data-fleet-state><option value="">All statuses</option><option>Running</option><option>Starting</option><option>Stopped</option><option>Missing</option><option>Unavailable</option><option>Failed</option></select></label>
  </div>
  {% include "_fleet.html" %}
</section>
{% endblock %}
