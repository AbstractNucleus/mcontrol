{% extends "mcontrol_base.html" %}
{% from "_icons.html" import icon %}

{% block title %}mcontrol: servers{% endblock %}

{% block main %}
<section class="fleet-page">
  <div class="home-header">
    <div class="home-header__title">
      <h1 class="t-h1">Servers</h1>
    </div>
    <div class="home-header__actions">
      <button class="btn btn--ghost btn--sm"
              type="button"
              hx-post="/rescan"
              hx-swap="none"
              hx-disabled-elt="this"
              title="Discover server folders and refresh container status">{{ icon('refresh', 15) }} Rescan{% include "_spinner.html" %}</button>
      <a class="btn btn--primary" href="/servers/new">{{ icon('plus', 15) }} New server</a>
    </div>
  </div>

  {% include "_fleet.html" %}
</section>
{% endblock %}
