{# Player count in the panel header. Polls the existing console connection;
   refreshes on lifecycle changes. Context: server, running, ok and counts. #}
{% if ok %}
<span id="online-chip"
      class="online-chip"
      hx-get="/servers/{{ server.name }}/players/online"
      hx-trigger="every 60s, mc:refresh, mc:state-changed from:body" data-poll
      hx-swap="outerHTML"
      {% if names %}title="{{ names | join(', ') }}"{% endif %}>
  <span class="online-chip__dot" aria-hidden="true"></span>
  {{ online }}/{{ max_players }} online
</span>
{% elif running %}
<span id="online-chip"
      class="state-pill state-pill--unknown"
      hx-get="/servers/{{ server.name }}/players/online"
      hx-trigger="every 60s, mc:refresh, mc:state-changed from:body" data-poll
      hx-swap="outerHTML">Online count unavailable</span>
{% else %}
<span id="online-chip" class="state-pill state-pill--exited"
      hx-get="/servers/{{ server.name }}/players/online"
      hx-trigger="every 60s, mc:refresh, mc:state-changed from:body" data-poll
      hx-swap="outerHTML" title="Saved on disk; applies at next start">Saved on disk</span>
{% endif %}
